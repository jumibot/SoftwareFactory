# Publica la página web de la SF (la carpeta site/) en GitHub Pages cada vez que cambia en main, es decir, con cada
# RELEASE que la toque: la página enseña lo publicado, lo que se instala. También se puede lanzar a mano.
# Pages tiene que estar activado con la fuente «GitHub Actions» (build_type=workflow).
name: Página web

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: despliegue
        uses: actions/deploy-pages@v4

es e informes antiguos</li></ul></div><div data-ficha="env" data-nombre="fundacional · informe"><p>fundacional_to_html.py e informe_to_html.py, 18 líneas cada uno.</p><ul><li>perfil.json: tipo y recursos elegidos; el informe añade las preguntas</li><li>css y js propios: ninguno</li><li>en la SF: 4 informes y el ejemplo de diagramas; en SpriteAnimation, el fundacional</li></ul></div><div data-ficha="tec" data-nombre="técnica · interfaz"><p>definicion_tecnica y diseno_interfaz escriben .md con SVG.</p><ul><li>generador: ninguno nombrado, ni perfil</li><li>bocetos: HTML autocontenidos y neutros a propósito</li><li>fuera: infografia_tecnica, página three.js propia sin kit</li></ul></div><div data-ficha="dtoh" data-nombre="doc_to_html.py"><p>La maqueta de la visión.</p><ul><li>cabecera: franja con logo, nombre y producto; barra de estado</li><li>secciones: barras plegables con chip; ### y #### también plegables</li><li>escala: página de 980 px abierta a todo el ancho; h2 de 1,05 rem</li><li>pie: oscuro, con producto y tipo</li><li>tiene: estilo del tema, código coloreado, colores de los SVG al tema</li><li>falta: diagramas y su herramienta</li></ul></div><div data-ficha="dah" data-nombre="documento_a_html.py"><p>El motor común de crear_documentos.</p><ul><li>cabecera: portada editorial blanca, oscura o compacta (rama 308)</li><li>secciones: «01 / ETIQUETA» y h2 de hasta 2,2 rem, plegables</li><li>escala: hoja de 1240 px y letra de 17 px</li><li>pie: producto, tipo, versión, estado, pie y procedencia</li><li>recursos: tarjetas, columnas, fichas, preguntas, fuentes, lector</li><li>falta: estilo del tema, código coloreado, colores de los SVG al tema</li></ul></div><div data-ficha="tema" data-nombre="tema_identidad.py"><p>Temas de assets/temas e identidad.json del proyecto.</p><ul><li>identidad: tema, logo, producto, tipo, css, js, iconos, destino, herramientas</li><li>estilo del tema: cabecera, etiqueta, marcador, esquinas; solo lo aplica la visión</li><li><b class="d-bt">SF</b> tema-azul.json; pasará al amarillo</li></ul></div><div data-ficha="kit" data-nombre="kit_documentos"><p>tools/kit_documentos, común a los dos.</p><ul><li>piezas: herramientas, lectura, edicion, diagramas.js</li><li>copias: actualizar_copia.py y extraer_notas.py</li></ul></div><div data-ficha="diag" data-nombre="diagramas"><p>generar_diagrama.py --fragmento.</p><ul><li>tema: tinta por defecto, grabado como data-d-tema</li><li>efecto: el motor pinta la figura con tinta y su papel, no con el tema del documento</li><li>sin tema: la figura toma el del documento</li></ul></div></div></figure>

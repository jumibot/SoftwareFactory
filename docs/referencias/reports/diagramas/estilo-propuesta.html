gar de excepciones</li></ul></div><div data-ficha="html" data-nombre="Documentos"><p>Todos los documentos del proyecto, con el mismo aspecto.</p></div><div data-ficha="skill" data-nombre="Skill de estilo"><p>Ayuda a fijar los parámetros; no maqueta.</p><ul><li>muestras: el desarrollador elige entre varias, hechas por el generador</li><li>afinado: en vueltas, y después con el uso</li></ul></div><div data-ficha="param" data-nombre="Estilo e identidad"><p>Es del proyecto, no de cada documento, y lo lee el generador.</p><ul><li>estilo: colores, letra y forma de las páginas</li><li>identidad: logo y nombre del producto, que se ven en portada y pie</li><li>de él sale: también el color de sesión (310)</li></ul></div><div data-ficha="comp" data-nombre="Componentes propios"><p>CSS y JS de los componentes del proyecto, como una calculadora.</p><ul><li>no es estilo: no los fija la skill, pero usan sus variables</li></ul></div></div></figure>

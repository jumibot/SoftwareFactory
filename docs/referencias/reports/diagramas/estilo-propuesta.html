="4"/><rect class="d-nota-b" x="8" y="8" width="3" height="83.2"/><text class="d-nota-t d-etiqueta" x="20" y="32.5" font-size="10.5">La skill de estilo no maqueta</text><text class="d-nota-x" x="20" y="57.2" font-size="13.5">fija los parámetros; las muestras y los documentos</text><text class="d-nota-x" x="20" y="77.2" font-size="13.5">los hace el generador</text></g><g class="d-nota"><rect class="d-nota-c" x="8" y="99.2" width="384" height="83.2" rx="4"/><rect class="d-nota-b" x="8" y="99.2" width="3" height="83.2"/><text class="d-nota-t d-etiqueta" x="20" y="123.7" font-size="10.5">La infografía</text><text class="d-nota-x" x="20" y="148.4" font-size="13.5">lee los parámetros del estilo sin pasar por el</text><text class="d-nota-x" x="20" y="168.4" font-size="13.5">generador (tarea 8)</text></g></svg><div class="d-pie"><span>SF · DOCUMENTOS</span><span>DECISIONES 305 A 311 <span class="d-recuento">· 9 NODOS · 7 FLECHAS</span></span></div><div class="d-fichas" hidden><div data-ficha="perf" data-nombre="Skills de tipo"><p>Una por tipo de documento: visión, explicativo, fundacional, informe, técnica, interfaz.</p><ul><li>dan: contenido, estructura, tono y procedimiento</li><li>eligen: qué recursos del catálogo usan</li></ul></div><div data-ficha="info" data-nombre="Infografía técnica"><p>La página three.js de la infografía técnica.</p><ul><li>estilo: página, panel y HUD con los parámetros del proyecto (tarea 8)</li><li>no cambia: los colores con significado del modelo</li></ul></div><div data-ficha="diag" data-nombre="diagramas"><p>Se pintan con el estilo del documento en el que van (307).</p></div><div data-ficha="cat" data-nombre="Catálogo de recursos"><p>Los recursos con su sintaxis y cuándo usar cada uno.</p><ul><li>también: los de la visión (308)</li><li>lo dibuja: el generador; las skills de tipo solo eligen</li></ul></div><div data-ficha="gen" data-nombre="Generador único"><p>El único generador de documentos, determinista (305).</p><ul><li>maqueta: cualquier documento, con los parámetros del estilo</li><li>herramientas: añade las de lectura del kit (buscador, notas, lectura, Diagramas) según el documento</li><li>calidad: comprueba la salida en escritorio y móvil, y la impresión A4</li><li>evoluciona: gana parámetros con el uso, en lugar de excepciones</li></ul></div><div data-ficha="html" data-nombre="Documentos"><p>Todos los documentos del proyecto, con el mismo aspecto.</p></div><div data-ficha="skill" data-nombre="Skill de estilo"><p>Ayuda a fijar los parámetros; no maqueta.</p><ul><li>muestras: el desarrollador elige entre varias, hechas por el generador</li><li>afinado: en vueltas, y después con el uso</li></ul></div><div data-ficha="param" data-nombre="Estilo e identidad"><p>Es del proyecto, no de cada documento, y lo lee el generador.</p><ul><li>estilo: colores, letra y forma de las páginas</li><li>identidad: logo y nombre del producto, que se ven en portada y pie</li><li>de él sale: también el color de sesión (310)</li></ul></div><div data-ficha="comp" data-nombre="Componentes propios"><p>CSS y JS de los componentes del proyecto, como una calculadora.</p><ul><li>no es estilo: no los fija la skill, pero usan sus variables</li></ul></div></div></figure>

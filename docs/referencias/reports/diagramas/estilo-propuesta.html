div><div class="d-fichas" hidden><div data-ficha="perf" data-nombre="Skills de tipo"><p>Visión, explicativo, fundacional, informe, técnica e interfaz.</p><ul><li>dan: contenido, estructura, tono y procedimiento</li><li>eligen: qué recursos del catálogo les convienen (308)</li><li>perfil.json: tipo y recursos, como hoy el fundacional y el informe</li></ul></div><div data-ficha="diag" data-nombre="diagramas"><p>El fragmento sale sin tema propio (307).</p><ul><li>toma: papel, colores, acento y letra del documento</li><li>tinta: en el selector de la herramienta y en las páginas sueltas</li><li>contraste: el estilo tiene que dar 4,5:1 en el texto tenue</li></ul></div><div data-ficha="maq" data-nombre="Skill de maquetación"><p>La skill común que dirige la maquetación (305).</p><ul><li>motor: documento_a_html.py, el único; doc_to_html.py pasa a envoltorio</li><li>catálogo: todos los recursos, también los de la visión (308)</li><li>kit: herramientas, lectura, edicion y diagramas.js, como hoy</li><li>estilo: pregunta por él, enseña muestras y lo afina</li></ul></div><div data-ficha="html" data-nombre="Documentos"><p>Todos los documentos del proyecto con el mismo aspecto.</p><ul><li>migrar: cada uno cuando se vuelve a tocar (309)</li><li>secciones: sin etiqueta, número y título hasta que el estilo diga otra cosa (306)</li></ul></div><div data-ficha="estilo" data-nombre="Estilo del proyecto"><p>Es del proyecto, no de cada documento (305).</p><ul><li>lleva: tema (colores, letra, serie) y forma (portada, secciones, escala, ancho, pie)</li><li>se afina: a medida que avanza el proyecto</li><li><b class="d-bt">SF</b> parte del estilo del informe 385, con el amarillo de la 382</li><li>color de sesión: el de /color más cercano a su primario (310); hoy purple es de la SF y los proyectos eligen entre siete</li></ul></div><div data-ficha="mues" data-nombre="Muestras"><p>Varias muestras del mismo documento, cada una con un estilo.</p><ul><li>cuándo: la primera vez que el proyecto necesita documentos</li><li>afinado: vueltas sucesivas, como en la skill de diagramas</li></ul></div></div></figure>

n><div data-ficha="pide" data-nombre="Petición"><p>Al fijar el estilo por primera vez o al usarlo después.</p><ul><li>ejemplo: «los bloques de código, con filete», «el enlace del repo, legible»</li></ul></div><div data-ficha="dec" data-nombre="¿Lo sabe hacer?"><p>La skill mira el catálogo de parámetros del generador.</p><ul><li>arreglo: si es un fallo del generador (un contraste), se arregla, sin parámetro</li><li>parámetro: si es una preferencia de aspecto</li></ul></div><div data-ficha="prueba" data-nombre="Valores en prueba"><p>Un estilo.json provisional en la carpeta de muestras; el del proyecto no cambia hasta aceptar.</p></div><div data-ficha="muestras" data-nombre="Muestras"><p>El generador con los valores en prueba sobre un documento de muestra fijo.</p><ul><li>comprobación: escritorio, móvil, A4 y contraste, como cualquier documento</li></ul></div><div data-ficha="acepta" data-nombre="Aceptar"><p>El desarrollador elige; la skill respalda estilo.json, sube su versión y anota el historial.</p><ul><li>historial: versión, fecha, qué cambia y por qué, en una línea</li><li>documentos: cambian al regenerarlos (309)</li></ul></div><div data-ficha="nuevo" data-nombre="Parámetro"><p>Tarea de implementar «Añadir al generador el parámetro …».</p><ul><li>en la SF: va a su cola, bajo Mejorar la Software Factory</li><li>en otro proyecto: es de la SF; Claude lo dice en una línea y ofrece abrir una issue en GitHub de la SF; no se anota en el estilo</li><li>pruebas, en plugins/sf/tests/: con cada valor genera la muestra y comprueba lo que cambia</li><li>pruebas, por defecto: la muestra sale idéntica a la copia de referencia</li><li>catálogo: su línea en la referencia y en las notas de la versión</li></ul></div></div></figure>

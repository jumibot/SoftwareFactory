></svg><svg class="d-notas-svg vertical solo-estrecho" data-lugar="debajo" data-tam="amplio" viewBox="0 0 400 210.4" role="img" aria-labelledby="estilo-parametros-nv-debajo-amplio"><title id="estilo-parametros-nv-debajo-amplio">Notas</title><g class="d-nota"><rect class="d-nota-c" x="8" y="8" width="384" height="103.2" rx="4"/><rect class="d-nota-b" x="8" y="8" width="3" height="103.2"/><text class="d-nota-t d-etiqueta" x="20" y="32.5" font-size="10.5">Por defecto, lo de hoy</text><text class="d-nota-x" x="20" y="57.2" font-size="13.5">un parámetro que falta deja la salida como hoy; uno</text><text class="d-nota-x" x="20" y="77.2" font-size="13.5">desconocido detiene el generador y enseña los</text><text class="d-nota-x" x="20" y="97.2" font-size="13.5">posibles</text></g><g class="d-nota"><rect class="d-nota-c" x="8" y="119.2" width="384" height="83.2" rx="4"/><rect class="d-nota-b" x="8" y="119.2" width="3" height="83.2"/><text class="d-nota-t d-etiqueta" x="20" y="143.7" font-size="10.5">Derivado, no se guarda</text><text class="d-nota-x" x="20" y="168.4" font-size="13.5">el color de sesión (310), los tonos que faltan y el</text><text class="d-nota-x" x="20" y="188.4" font-size="13.5">informe de contraste</text></g></svg><div class="d-pie"><span>SF · ESTILO</span><span>TAREA 387 <span class="d-recuento">· 9 NODOS · 0 FLECHAS</span></span></div><div class="d-fichas" hidden><div data-ficha="ident" data-nombre="Identidad"><p>Forma parte del estilo (313); sale en portada, pie y título de la pestaña.</p><ul><li>producto: texto · por defecto, el nombre de .sf/proyecto.json → marca de portada, pie y &lt;title&gt;</li><li>logo: ruta | ninguno · por defecto ninguno → 40 px de alto en la portada</li><li>logo-oscuro: ruta | igual · por defecto igual, sobre placa blanca → portada oscura o de color</li><li>enlace: url | ninguno · por defecto ninguno → enlace al repositorio en la portada (hoy cabecera.css de SpriteAnimation)</li></ul></div><div data-ficha="color" data-nombre="Colores"><p>Roles con contraste comprobado; se guardan en hex, resueltos.</p><ul><li>primario: hex, el único obligatorio → marca, etiquetas, botones; de él sale el color de sesión (310)</li><li>sobre-primario: hex · por defecto blanco o tinta, el de más contraste → texto sobre el primario (≥ 4,5:1)</li><li>primario-texto: hex · por defecto el primario → enlaces y rótulos sobre la página (≥ 4,5:1); nuevo, para primarios claros como el amarillo</li><li>oscuro · acento · segundo: hex · derivados o los mínimos de hoy → portada oscura, avisos, recorrido de los diagramas</li><li>texto · texto-suave · texto-tenue: hex → ≥ 4,5:1 sobre página y fondo</li><li>página · fondo · fondo-medio · fondo-suave · borde · línea · tenue: hex · derivados del primario → superficies; borde ≥ 3:1 si marca una caja</li><li>colores-oscuro: rol → hex | ninguno · por defecto ninguno (Lectura invierte) → páginas con data-theme dark</li><li>serie: lista | ninguna · por defecto ninguna (todos los bloques en primario) → un color por sección, en ciclo</li><li>significado: correcto, aviso, error, info · por defecto los de las tarjetas (verde, naranja, frambuesa, turquesa) → tarjetas y estados</li></ul></div><div data-ficha="letra" data-nombre="Letra y escala"><p>Familias y tamaños; las fuentes, solo de Google Fonts o del sistema.</p><ul><li>texto · títulos · escena · código: familia CSS · por defecto DM Sans, Space Grotesk, Source Serif 4, ui-monospace → cuerpo, h1–h3, citas, código</li><li>url: Google Fonts | vacío (sistema) · por defecto la de las tres de hoy → la hoja que se carga</li><li>tamaño: 16 | 17 | 18 px · por defecto 17 → letra del cuerpo en pantalla</li><li>escala: editorial | compacta · por defecto editorial (h2 hasta 2,2 rem) → compacta, la de la visión (h2 1,05 rem)</li></ul></div><div data-ficha="portada" data-nombre="Portada"><p>La cabecera de todos los documentos del proyecto.</p><ul><li>forma: clara | oscura | compacta · por defecto clara → hoy «portada:» en cada .md; pasa al estilo</li><li>fondo: oscuro | primario · por defecto oscuro → color de la portada oscura (hoy «cabecera» del tema)</li><li>línea: sí | no · por defecto sí → filete de color bajo el titular en la clara</li></ul></div><div data-ficha="secc" data-nombre="Secciones"><p>Sustituye a la 306 cuando el proyecto lo fija.</p><ul><li>cabecera: numero-etiqueta | numero-titulo | titulo · por defecto numero-etiqueta → «01 / ETIQUETA» sobre el h2; sin etiqueta, número y título (306)</li><li>etiqueta: tinte | sólida | línea | ninguna · por defecto tinte → fondo de la cabecera de sección (hoy «etiqueta» del tema)</li><li>opacidad: 0,2–0,5 o 0,75–1 · por defecto 1 → con sólida; el texto cambia de color para seguir legible</li><li>marcador: círculo | cuadrado | ninguno · por defecto círculo → la marca de plegado</li><li>plegado: primera | todas | ninguna · por defecto primera → qué secciones abren al cargar</li></ul></div><div data-ficha="pagina" data-nombre="Página y pie"><p>Forma de la hoja y del pie.</p><ul><li>ancho: 980–1400 px · por defecto 1240 → ancho máximo de la hoja; en móvil, siempre 16 px de margen</li><li>esquinas: 0–16 px · por defecto 6 → tarjetas, botones, fichas, código y diagramas</li><li>código: bloque | línea · por defecto bloque con fondo suave y filete → bloques de código (hoy codigo.css de SpriteAnimation)</li><li>pie: claro | oscuro · por defecto claro → oscuro, el de la visión, con producto y tipo</li></ul></div><div data-ficha="lectura" data-nombre="Lectura"><p>Función de lectura; el documento puede cambiarla.</p><ul><li>destino: proyecto | usuario · sin valor, el generador se detiene (183) → herramientas recomendadas</li><li>herramientas: recomendadas | lista | cambios · sin valor, se detiene (183) → data-herramientas</li><li>menú: botones | secciones | no · por defecto botones → enlaces de sección en la barra</li></ul></div><div data-ficha="diag" data-nombre="Diagramas"><p>Los valores de partida de la herramienta «Diagramas» (302) en los documentos del proyecto.</p><ul><li>forma · borde · fondo · grosor · punta · esquinas: los del selector · por defecto los de la 302 → cada figura nueva</li><li>recorrido: segundo | acento | grueso · por defecto segundo → resaltado del recorrido</li><li>tema: el del documento (307); tinta queda en el selector</li></ul></div><div data-ficha="aparte" data-nombre="Infografía y web"><p>No pasan por el generador, pero leen los mismos parámetros.</p><ul><li>infografía · escenario: derivado | claro · por defecto derivado del oscuro → fondo del 3D (tarea 8)</li><li>infografía · hud: primario | acento | hex · por defecto primario-vivo, ≥ 3:1 sobre el escenario → etiquetas HUD</li><li>web: solo colores y letra (312); su forma de página es propia</li></ul></div></div></figure>

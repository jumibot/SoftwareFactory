<title>Equipo de ejemplo 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
  Plantilla genérica de infografía técnica (skill infografia_tecnica de la Software Factory).
  El producto es un ejemplo neutro: sustituir CFG, MODES, PARTS, la geometría y los textos por los del proyecto.
  Pruebas: ?test&mode=marcha&explode=60&cut=1&sel=placa&lang=en fija un estado y escribe una foto en body[data-snap].
-->
<style>
:root{
  --bg:#eef1f5; --ink:#1b2430; --muted:#5d6878;
  --stage-a:#15243a; --stage-b:#060b14;
  --hud:#6ff3ff; --hud-dim:rgba(111,243,255,.42); --hud-glass:rgba(8,26,40,.62); --hud-ink:#dafcff;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --barH:96px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1118;--ink:#e6edf5;--muted:#9aa6b6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1118;--ink:#e6edf5;--muted:#9aa6b6;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column}
/* El escenario es siempre oscuro, aunque la página esté en tema claro */
#view{position:relative;flex:1;min-height:260px;border-radius:18px;overflow:hidden;touch-action:none;background:radial-gradient(120% 90% at 50% 35%,var(--stage-a),var(--stage-b))}
#view canvas{display:block;width:100%;height:100%;outline:none}
.grid{position:absolute;inset:0;pointer-events:none;z-index:1;background:
  linear-gradient(rgba(111,243,255,.05) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(111,243,255,.05) 1px,transparent 1px) 0 0/40px 40px}
.grid::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(111,243,255,.03) 0 1px,transparent 1px 3px)}
.grid::before{content:"";position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(transparent,rgba(111,243,255,.06),transparent);animation:scan 9s linear infinite}
@keyframes scan{to{top:100%}}
@media (prefers-reduced-motion:reduce){.grid::before{animation:none;display:none}}
.hud{color:var(--hud-ink)}
.glass{background:var(--hud-glass);border:1px solid var(--hud-dim);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 18px rgba(111,243,255,.12)}

/* Etiquetas y líneas guía: elementos fijos que solo se mueven con transformaciones */
#leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#leaders polyline{fill:none;stroke:var(--hud);stroke-width:1;opacity:.75}
#leaders circle{fill:var(--hud)}
#tags{position:absolute;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;border:0;background:none;padding:0;cursor:pointer;color:var(--hud-ink);font:500 10.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;will-change:transform}
.tag.l{flex-direction:row-reverse}
.tag .no{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(8,26,40,.75);color:var(--hud);border:1.5px solid var(--hud);font:600 10px/1 var(--mono);box-shadow:0 0 10px rgba(111,243,255,.5)}
.tag .nm{background:var(--hud-glass);border:1px solid var(--hud-dim);padding:5px 9px;border-radius:3px;white-space:nowrap;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.tag.on .no{background:var(--hud);color:#04121b;box-shadow:0 0 16px var(--hud)}
.tag.on .nm{border-color:var(--hud);background:rgba(111,243,255,.16);color:#fff}
.tag:focus-visible{outline:none}
.tag:focus-visible .no{outline:2px solid #fff;outline-offset:2px}
#view.phone .tag:not(.on) .nm{display:none}

/* Título y estado, arriba a la izquierda */
.scenetitle{position:absolute;left:16px;top:14px;z-index:4;max-width:min(380px,calc(100% - 240px));padding:12px 14px}
.st-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.scenetitle h1{margin:0;font:600 19px/1.15 var(--body);letter-spacing:.01em;color:#fff}
.st-mode{margin:6px 0 0;font:600 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--hud)}
.st-text{margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--hud-ink);opacity:.9}
.lang{display:flex;gap:6px}
.lang button{width:24px;height:16px;padding:0;border:1px solid var(--hud-dim);border-radius:2px;background:none;cursor:pointer;opacity:.55;overflow:hidden}
.lang button[aria-pressed="true"]{opacity:1;border-color:var(--hud)}
.lang svg{display:block;width:100%;height:100%}
@media (max-height:620px){.st-text{display:none}}
#view.phone .st-text{display:none}

/* Capas: columna de ojos bajo el título (el script fija su top) */
.layers{position:absolute;z-index:4;top:150px;left:18px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ly{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:#fff;padding:0;cursor:pointer;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 4px rgba(0,0,0,.95),0 0 12px rgba(111,243,255,.35)}
.ly svg{width:30px;height:30px;padding:6px;border-radius:50%;border:1.5px solid var(--hud);background:rgba(111,243,255,.18);box-shadow:0 0 10px rgba(111,243,255,.3);fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ly .off{display:none}
.ly[aria-pressed="false"]{color:var(--hud-dim);text-decoration:line-through}
.ly[aria-pressed="false"] svg{border-color:var(--hud-dim);background:rgba(6,18,28,.55);stroke:var(--hud-dim);box-shadow:none}
.ly[aria-pressed="false"] .on{display:none}
.ly[aria-pressed="false"] .off{display:inline}
.ly:hover svg{border-color:#fff}
.ly:focus-visible{outline:2px solid #fff;outline-offset:2px}
#view.phone .layers{gap:5px}
#view.phone .ly svg{width:26px;height:26px;padding:5px}

/* Indicadores arriba a la derecha: batería y medidor de consumo calculado, con su explicación */
.power{position:absolute;z-index:4;top:14px;right:18px;width:190px;color:var(--hud-ink);text-align:center;pointer-events:none;text-shadow:0 0 4px rgba(0,0,0,.95)}
.pw-lbl{font:500 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hud-dim);margin-top:4px}
.bat{margin:0 0 12px}
.bat-row{display:flex;align-items:center;justify-content:center;gap:9px}
.bat-cell{position:relative;width:104px;height:16px;border:1.5px solid var(--hud-dim);border-radius:4px;padding:2px}
.bat-cell::after{content:"";position:absolute;right:-5px;top:3.5px;width:3px;height:6px;background:var(--hud-dim);border-radius:0 2px 2px 0}
.bat-cell i{display:block;height:100%;width:0;border-radius:2px;background:var(--hud);box-shadow:0 0 8px var(--hud);transition:width .6s ease}
.bat-row b{font:600 19px/1 var(--body);color:#fff;font-variant-numeric:tabular-nums;min-width:52px;text-align:left}
.bat-wh{font:500 11px/1.3 var(--mono);color:var(--hud);margin-top:2px}
.power svg{width:100%;height:auto;display:block;overflow:visible}
.pw-track{fill:none;stroke:var(--hud-dim);stroke-width:7;stroke-linecap:round;opacity:.45}
.pw-val{fill:none;stroke:var(--hud);stroke-width:7;stroke-linecap:round}
.pw-tick{stroke:var(--hud-dim);stroke-width:1.2}
.pw-tl{fill:var(--hud-dim);font:500 9px/1 var(--mono)}
.pw-needle{stroke:#fff;stroke-width:2;stroke-linecap:round}
.pw-num{font:600 26px/1 var(--body);color:#fff;margin-top:2px;font-variant-numeric:tabular-nums}
.pw-num small{font:500 12px/1 var(--mono);color:var(--hud);margin-left:3px}
.pw-auto{font:500 11px/1.3 var(--mono);color:var(--hud);margin-top:2px}
.pw-info{position:absolute;bottom:22px;right:4px;width:24px;height:24px;border-radius:50%;border:1px solid var(--hud);background:rgba(6,18,30,.7);color:var(--hud);font:italic 700 13px/1 var(--body);cursor:pointer;pointer-events:auto;box-shadow:0 0 10px rgba(111,243,255,.35)}
.pw-info:hover,.pw-info:focus-visible{background:var(--hud);color:#04121b;outline:none}
#view.phone .power{width:130px;top:10px;right:10px}
#view.phone .pw-num{font-size:19px;margin-top:0}
#view.phone .bat{margin:0 0 6px}
#view.phone .bat-cell{width:76px}
#view.phone .bat-row b{font-size:15px;min-width:40px}
#view.phone .pw-info{bottom:16px;right:0}

/* Controles sueltos abajo: modos y despiece a la izquierda; interruptores en columna a la derecha */
.hudbar{position:absolute;left:18px;right:18px;bottom:16px;z-index:4;display:flex;flex-wrap:nowrap;align-items:flex-end;justify-content:space-between;gap:18px;pointer-events:none;text-shadow:0 0 4px rgba(0,0,0,.95),0 0 12px rgba(111,243,255,.35)}
.hudbar>*{pointer-events:auto}
.ctl-left{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.ctl-right{display:flex;align-items:flex-end;gap:16px}
/* Modos como trayecto con nodos y tramo iluminado */
.journey{position:relative;display:flex;gap:30px;padding:0 4px}
.j-line{position:absolute;left:38px;right:38px;top:11px;height:2px;background:var(--hud-dim)}
.j-line i{display:block;height:100%;width:0;background:var(--hud);box-shadow:0 0 8px var(--hud);transition:width .6s ease}
.journey button{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer;color:var(--hud-dim);font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;min-width:76px}
.j-node{width:22px;height:22px;border-radius:50%;border:2px solid var(--hud-dim);background:#06121c;transition:all .3s}
.journey button.done .j-node{border-color:var(--hud);background:rgba(111,243,255,.35)}
.journey button[aria-pressed="true"]{color:#fff}
.journey button[aria-pressed="true"] .j-node{border-color:var(--hud);background:var(--hud);box-shadow:0 0 0 4px rgba(111,243,255,.18),0 0 14px var(--hud)}
.journey button:hover{color:var(--hud-ink)}
/* Despiece como medidor con marcas, rombo y porcentaje */
.gauge{display:flex;align-items:center;gap:12px;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hud-ink)}
.gauge .g-lbl{min-width:120px}
.gauge input[type=range]{-webkit-appearance:none;appearance:none;width:220px;height:18px;cursor:pointer;background:
  repeating-linear-gradient(90deg,var(--hud-dim) 0 1px,transparent 1px 10%) 0 50%/100% 8px no-repeat,
  linear-gradient(var(--hud-dim),var(--hud-dim)) 0 50%/100% 1px no-repeat}
.gauge input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--hud);transform:rotate(45deg);box-shadow:0 0 10px var(--hud);border:0}
.gauge input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--hud);transform:rotate(45deg);box-shadow:0 0 10px var(--hud);border:0;border-radius:0}
.gauge output{font-size:13px;min-width:42px;color:var(--hud);font-variant-numeric:tabular-nums}
/* Conmutadores como interruptores redondos con icono y piloto */
.switches{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sw{display:inline-flex;flex-direction:row-reverse;align-items:center;gap:10px;border:0;background:none;color:var(--hud-ink);padding:0;cursor:pointer;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.sw svg{width:40px;height:40px;padding:9px;border-radius:50%;border:1.5px solid var(--hud-dim);background:rgba(6,18,28,.55);box-shadow:0 0 10px rgba(111,243,255,.25);fill:none;stroke:var(--hud-ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sw::after{content:"";order:-1;width:6px;height:6px;border-radius:50%;background:#20313d}
.sw[aria-pressed="true"]{color:#fff}
.sw[aria-pressed="true"] svg{background:var(--hud);stroke:#04121b;border-color:var(--hud)}
.sw[aria-pressed="true"]::after{background:var(--hud);box-shadow:0 0 8px var(--hud)}
.sw:hover svg{border-color:var(--hud)}
.journey button:focus-visible,.sw:focus-visible,.gauge input:focus-visible{outline:2px solid #fff;outline-offset:3px}
#view.narrow .sw span{display:none}
#view.phone .hudbar{left:12px;right:12px;bottom:12px;flex-direction:column;align-items:stretch;gap:10px}
#view.phone .ctl-right{justify-content:flex-end}
#view.phone .switches{flex-direction:row;gap:6px}
#view.phone .sw svg{width:34px;height:34px;padding:7px}
#view.phone .journey{gap:12px}
#view.phone .journey button{min-width:56px;font-size:10.5px}
#view.phone .gauge .g-lbl{min-width:88px}
#view.phone .gauge input[type=range]{width:120px}
#view.phone .scenetitle{left:10px;top:10px;max-width:calc(100% - 160px);padding:8px 10px}
#view.phone .scenetitle h1{font-size:16px}

/* Detalle de la pieza (y explicación del medidor) en un HUD central; el fondo se difumina */
#view.veiled canvas,#view.veiled #tags,#view.veiled #leaders,#view.veiled .scenetitle,#view.veiled .layers,#view.veiled .power,#view.veiled .hudbar{filter:blur(3px) brightness(.6)}
.infoveil{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:16px}
.info{position:relative;width:min(560px,100%);max-height:calc(100% - 16px);overflow-x:hidden;overflow-y:auto;padding:20px 22px;border-radius:16px;font-size:15.5px;line-height:1.55;color:var(--hud-ink);scrollbar-width:thin;scrollbar-color:var(--hud-dim) transparent}
.info h2{margin:0 36px 2px 0;font:600 20px/1.2 var(--body);color:#fff}
.info .kicker{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--hud)}
.info h3{margin:14px 0 3px;font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--hud)}
.info p{margin:0}
.info table{width:100%;border-collapse:collapse;font:400 13px/1.4 var(--mono);margin-top:6px}
.info td,.info th{padding:5px 6px;border-bottom:1px solid rgba(111,243,255,.18);text-align:left;vertical-align:top}
.info td.n{text-align:right;white-space:nowrap}
.info .close{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--hud-dim);background:none;color:#fff;font-size:18px;line-height:1;cursor:pointer}
.err{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;max-width:min(440px,90%);padding:14px 16px;border-radius:10px;background:rgba(40,8,8,.85);border:1px solid #ff8a8a;color:#ffe1e1;font-size:14px;text-align:center}
.err.wait{background:rgba(8,26,40,.85);border-color:var(--hud-dim);color:var(--hud-ink)}
.toast{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px solid var(--hud-dim);font:400 11.5px/1.3 var(--mono);color:#ffd9a0}
.toast button{border:0;background:none;color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
</style>

<div class="wrap">
  <div id="view" data-mode="reposo" aria-label="Modelo 3D del equipo">
    <div class="grid" aria-hidden="true"></div>
    <noscript><div class="err">Esta vista previa no ejecuta JavaScript. Abre el archivo en Safari, Chrome u otro navegador para ver el modelo 3D.</div></noscript>
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="tags"></div>

    <div class="scenetitle glass hud" aria-live="polite">
      <div class="st-head">
        <h1 id="st-title">Equipo de ejemplo</h1>
        <div class="lang" role="group" aria-label="Idioma">
          <button type="button" data-lang="es" title="Español" aria-label="Español"><svg viewBox="0 0 3 2" aria-hidden="true"><rect width="3" height="2" fill="#c60b1e"/><rect y=".5" width="3" height="1" fill="#ffc400"/></svg></button>
          <button type="button" data-lang="en" title="English" aria-label="English"><svg viewBox="0 0 60 30" aria-hidden="true"><rect width="60" height="30" fill="#012169"/><path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="2"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg></button>
        </div>
      </div>
      <p class="st-mode" id="st-mode">Reposo</p>
      <p class="st-text" id="st-text"></p>
      <div class="toast" id="toast" role="status" hidden><span>Automatic translation, not reviewed yet.</span><button type="button" aria-label="Close">×</button></div>
    </div>
    <div class="layers" id="layers" role="group" aria-label="Capas visibles"></div>

    <div class="power" id="power" aria-live="polite">
      <button type="button" class="pw-info" id="pw-info" aria-label="Cómo se calcula el consumo" title="Cómo se calcula el consumo">i</button>
      <div class="bat">
        <div class="bat-row"><span class="bat-cell"><i id="bat-fill"></i></span><b id="bat-pc"></b></div>
        <div class="pw-lbl">Batería</div>
        <div class="bat-wh" id="bat-wh"></div>
      </div>
      <svg viewBox="0 0 180 104" aria-hidden="true">
        <path class="pw-track" d="M20 92 A70 70 0 0 1 160 92"/>
        <path class="pw-val" id="pw-arc" d="M20 92 A70 70 0 0 1 160 92" pathLength="100" stroke-dasharray="0 100"/>
        <g id="pw-ticks"></g>
        <line class="pw-needle" id="pw-needle" x1="90" y1="92" x2="90" y2="34"/>
        <circle cx="90" cy="92" r="4" fill="#fff"/>
      </svg>
      <div class="pw-num"><span id="pw-w">0</span><small id="pw-u">mW</small></div>
      <div class="pw-lbl">Consumo</div>
      <div class="pw-auto" id="pw-auto"></div>
    </div>

    <div class="hudbar hud" id="hudbar">
      <div class="ctl-left">
        <div class="journey" id="journey" role="group" aria-label="Modo de funcionamiento"><span class="j-line" aria-hidden="true"><i id="j-fill"></i></span></div>
        <label class="gauge" for="explode"><span class="g-lbl">Despiece</span><input type="range" id="explode" min="0" max="100" step="1" value="0"><output id="explode-v" for="explode">0 %</output></label>
      </div>
      <div class="ctl-right">
        <div class="switches">
          <button type="button" class="sw" id="cut" aria-pressed="false" title="Corte"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M12 3v18" stroke-dasharray="2 2"/></svg><span>Corte</span></button>
          <button type="button" class="sw" id="labels" aria-pressed="true" title="Etiquetas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><path d="M8.5 12h6l3-4"/><circle cx="19" cy="7" r="1.5"/></svg><span>Etiquetas</span></button>
        </div>
      </div>
    </div>

    <div class="infoveil" id="infoveil" hidden>
      <div class="info glass" id="info" role="dialog" aria-modal="true" aria-labelledby="info-h">
        <button type="button" class="close" id="info-x" aria-label="Cerrar">×</button>
        <div id="info-body"></div>
      </div>
    </div>
  </div>
</div>

<script>
// aviso visible si la escena 3D no arranca o falla (útil en móviles)
(function(){
  function show(msg, wait){ var v=document.getElementById('view'); if(!v||v.querySelector('.err:not(.wait)'))return; var old=v.querySelector('.err.wait'); if(old)old.remove(); var d=document.createElement('div'); d.className='err'+(wait?' wait':''); d.textContent=msg; v.appendChild(d); }
  window.__sceneError = show;
  window.addEventListener('error', function(e){ show('No se ha podido mostrar el modelo 3D: ' + (e.message || 'error al cargar')); });
  window.addEventListener('unhandledrejection', function(e){ show('No se ha podido mostrar el modelo 3D: ' + ((e.reason && e.reason.message) || 'error al cargar')); });
  setTimeout(function(){ if(!window.__sceneReady) show('Cargando el modelo 3D… si no aparece, comprueba la conexión y recarga la página.', true); }, 15000);
})();
</script>

<script type="importmap">

<script type="module">

  }
  for (const it of items) { it.w = it.el.offsetWidth; it.h = it.el.offsetHeight; }   // todas las lecturas juntas
  const top = 12, bot = barTop - 8;
  for (const side of ['l', 'r']) {
    const col = items.filter(i => i.side === side).sort((a, b) => a.y - b.y);
    for (const it of col) {
      it.left = side === 'l' ? it.x - 14 - it.w : it.x + 14;
      if (sil) it.left = side === 'l' ? Math.min(it.left, sil.x0 - 10 - it.w) : Math.max(it.left, sil.x1 + 10);   // nunca sobre el modelo: fuera de su silueta
      it.left = Math.max(8, Math.min(w - 8 - it.w, it.left));
    }
    for (let i = 1; i < col.length; i++) { const a = col[i - 1], b = col[i], min = a.y + (a.h + b.h) / 2 + 6; if (b.y < min) b.y = min; }   // ninguna encima de otra
    const over = col.length ? col.at(-1).y + col.at(-1).h / 2 - bot : 0;
    if (over > 0) { col.at(-1).y -= over; for (let i = col.length - 2; i >= 0; i--) { const a = col[i], b = col[i + 1], max = b.y - (a.h + b.h) / 2 - 6; if (a.y > max) a.y = max; } }
    for (const it of col) it.y = Math.max(top + it.h / 2, it.y);
    // ningún panel HUD encima (título, capas, indicadores): se aparta en horizontal, con su borde real
    for (const it of col) for (const o of obs) if (it.left < o.r + 6 && it.left + it.w > o.l - 6 && it.y + it.h / 2 > o.t - 4 && it.y - it.h / 2 < o.b + 4) it.left = (o.l + o.r) / 2 < w / 2 ? o.r + 8 : o.l - 8 - it.w;
  }
  for (const it of items) {
    it.el.classList.toggle('l', it.side === 'l');
    it.el.style.transform = `translate(${it.left.toFixed(1)}px,${(it.y - it.h / 2).toFixed(1)}px)`;
    const ex = it.side === 'l' ? it.left + it.w : it.left;   // la línea sale del número, hacia el objeto
    it.ln.setAttribute('points', `${ex.toFixed(1)},${it.y.toFixed(1)} ${it.ax.toFixed(1)},${it.ay.toFixed(1)}`);
    it.dt.setAttribute('cx', it.ax.toFixed(1)); it.dt.setAttribute('cy', it.ay.toFixed(1)); it.dt.setAttribute('r', '2.2');
  }
  return items.length;
}

// ---------- bucle ----------
renderer.info.autoReset = false;   // el compositor dibuja la escena varias veces por fotograma
const timer = new THREE.Timer(); timer.connect(document);   // Clock obsoleto desde r183
let fc = 0, t0 = 0, stT = 0, nTags = 0;
const LOOK = {}; for (const k in MODES) LOOK[k] = MODES[k].luz;
const lookC = new THREE.Color(LOOK.reposo.c);
function frame() {
  renderer.info.reset(); timer.update(); const dt = Math.min(timer.getDelta(), 0.05); t0 += dt; stT += dt; fc++;
  const k = 1 - Math.pow(0.002, dt);   // estados continuos: interpolación hacia el objetivo
  for (const key in state) state[key] += (target[key] - state[key]) * k;
  const e = +explodeEl.value / 100;
  for (const x of EXPLODE) G[x.g].position.y = x.y * ease(Math.min(1, Math.max(0, (e - x.at) / 0.5)));
  ground.position.y = -13.2 + G.base.position.y;   // la sombra baja con la base
  G.int.userData.rotor.rotation.z += dt * state.fan * (reduce ? 4 : 30);
  // luz por modo, interpolada
  const lk = LOOK[mode]; lookC.lerp(cTmp.set(lk.c), k * 0.5); key.color.copy(lookC);
  key.intensity += (lk.i - key.intensity) * k * 0.5; renderer.toneMappingExposure += (lk.exp - renderer.toneMappingExposure) * k * 0.5;
  // flujo: solo cuando existe, con fuerza para verse, lento (≈ 14 s por recorrido)
  air.visible = state.fan > 0.03;
  if (air.visible) {
    const sp = reduce ? 0 : dt / CFG.flujo.segundos;
    for (let i = 0; i < AIR; i++) {
      const q = airP[i]; q.t = (q.t + sp) % 1; const c = airCurves[q.lane];
      c.getPointAt(q.t, dummy.position); c.getPointAt(Math.min(1, q.t + 0.01), pNext); dummy.lookAt(pNext);
      dummy.scale.setScalar(state.fan); dummy.updateMatrix(); air.setMatrixAt(i, dummy.matrix);
      air.setColorAt(i, cTmp.copy(COLD).lerp(WARM, Math.min(1, Math.max(0, (q.t - 0.45) / 0.25))));   // se calienta al cruzar la placa
    }
    air.instanceMatrix.needsUpdate = true; air.instanceColor.needsUpdate = true;
  }
  controls.update();
  if (fc % 6 === 1) recenter();
  nTags = placeLabels(fc % 4 === 1);
  if (stT > 0.2) { stT = 0; updateStatus(); }
  if (composer) composer.render(); else renderer.render(scene, camera);
  if (TEST && fc % 20 === 0) snap();
}
function snap() {   // foto del estado para las pruebas
  document.body.dataset.snap = JSON.stringify({fc, mode, explode: +explodeEl.value, cut, selected, lang: LANG,
    tags: PARTS.filter(p => !tagEls[p.id].hidden).map(p => p.id), P: +live.P.toFixed(3), h: +live.h.toFixed(1), info: !infoVeil.hidden,
    calls: renderer.info.render.calls, offset: [+centerFix.toFixed(1), +centerFixY.toFixed(1)]});
}

// ---------- idioma y arranque ----------
document.querySelectorAll('.lang button').forEach(b => {
  b.setAttribute('aria-pressed', b.dataset.lang === LANG);
  b.addEventListener('click', () => { try { localStorage.setItem('infografia.lang', b.dataset.lang); } catch (e) {} location.hash = 'lang=' + b.dataset.lang; location.reload(); });
});
const toast = document.getElementById('toast');
if (LANG !== 'es') { toast.hidden = false; toast.querySelector('button').addEventListener('click', () => { toast.hidden = true; }); }
setMode('reposo');
if (TEST) {   // ?test&mode=marcha&explode=60&cut=1&sel=placa
  if (Q.get('mode') in MODES) setMode(Q.get('mode'));
  if (Q.has('explode')) { explodeEl.value = Q.get('explode'); explodeEl.dispatchEvent(new Event('input')); }
  if (Q.get('cut') === '1') cutBtn.click();
  if (Q.get('labels') === '0') labelsBtn.click();
  for (const k in state) state[k] = target[k];
  controls.autoRotate = false;
  if (Q.has('sel')) setTimeout(() => select(Q.get('sel')), 300);
}
renderer.setAnimationLoop(frame);
window.__sceneReady = true;
document.querySelectorAll('#view .err.wait').forEach(e => e.remove());
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 622" width="560" height="622" role="img" aria-label="De una petición a una tarea: escribes en el chat, Claude la pone en la cola como tarea con pasos y rama, y un subagente hace los pasos" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title>De una petición a una tarea: escribes en el chat, Claude la pone en la cola como tarea con pasos y rama, y un subagente hace los pasos</title>
<rect width="560" height="622" rx="14" fill="#191512"/>
<circle cx="22" cy="20" r="5.5" fill="#ff5f57"/>
<circle cx="40" cy="20" r="5.5" fill="#febc2e"/>
<circle cx="58" cy="20" r="5.5" fill="#28c840"/>
<text x="280.0" y="25.0" font-size="12" fill="#a6a19c" text-anchor="middle" xml:space="preserve">pantry — claude</text>
<line x1="0" y1="38" x2="560" y2="38" stroke="#312d2a"/>
<text x="22.0" y="64.0" font-size="12" fill="#c8c3bc" font-weight="700" xml:space="preserve">1 · LO PIDES CON TUS PALABRAS</text>
<rect x="22.0" y="74.0" width="516.0" height="66.0" rx="8" fill="#262320" stroke="#3d3934" stroke-width="1.2"/>
<text x="34.0" y="98.0" font-size="14" xml:space="preserve"><tspan fill="#f5c400" font-weight="700">&gt; </tspan><tspan fill="#ece8e2">El CSV exportado rompe los nombres con acentos. Y</tspan></text>
<text x="50.8" y="118.0" font-size="14" fill="#ece8e2" xml:space="preserve">Ajustes necesita modo oscuro.</text>
<text x="22.0" y="170.0" font-size="12" fill="#c8c3bc" font-weight="700" xml:space="preserve">2 · CLAUDE LO CONVIERTE EN TAREAS</text>
<text x="22.0" y="196.0" font-size="14" xml:space="preserve"><tspan fill="#ece8e2" font-weight="700">● </tspan><tspan fill="#ece8e2">Dos peticiones, dos tareas:</tspan></text>
<text x="40.0" y="218.0" font-size="14" xml:space="preserve"><tspan fill="#ece8e2" font-weight="700"> </tspan><tspan fill="#ece8e2">47 Arreglar los acentos del CSV — rama feature/47-csv,</tspan></text>
<text x="48.4" y="238.0" font-size="14" fill="#ece8e2" xml:space="preserve">con su subagente.</text>
<text x="40.0" y="258.0" font-size="14" xml:space="preserve"><tspan fill="#ece8e2" font-weight="700"> </tspan><tspan fill="#ece8e2">48 Modo oscuro en Ajustes — en la cola; la empezará otro</tspan></text>
<text x="48.4" y="278.0" font-size="14" fill="#ece8e2" xml:space="preserve">subagente.</text>
<rect x="30.0" y="202.0" width="506.0" height="88.0" rx="8" fill="#f5c400" fill-opacity=".07" stroke="#f5c400" stroke-width="1.6"/>
<text x="22.0" y="322.0" font-size="12" fill="#c8c3bc" font-weight="700" xml:space="preserve">3 · UN SUBAGENTE TRABAJA, PASO A PASO</text>
<rect x="16" y="338" width="528" height="266" rx="6" fill="#22201d"/>
<text x="28.0" y="364.0" font-size="14" fill="#93c5fd" text-decoration="underline" xml:space="preserve">47</text>
<text x="53.2" y="364.0" font-size="14" fill="#93c5fd" xml:space="preserve">Arreglar los acentos del CSV</text>
<text x="532.0" y="364.0" font-size="14" fill="#6ed889" text-anchor="end" font-weight="700" xml:space="preserve">●</text>
<rect x="44.0" y="375.0" width="98.4" height="20.0" rx="3" fill="#000000"/>
<text x="93.2" y="389.0" font-size="12" fill="#6ed889" text-anchor="middle" xml:space="preserve">Activar rama</text>
<rect x="148.4" y="375.0" width="91.2" height="20.0" rx="3" fill="#000000"/>
<text x="194.0" y="389.0" font-size="12" fill="#6ed889" text-anchor="middle" xml:space="preserve">Redescribir</text>
<rect x="245.6" y="375.0" width="19.2" height="20.0" rx="3" fill="#000000"/>
<text x="255.2" y="389.0" font-size="12" fill="#6ed889" text-anchor="middle" xml:space="preserve">?</text>
<rect x="44.0" y="399.0" width="55.2" height="20.0" rx="3" fill="#000000"/>
<text x="71.6" y="413.0" font-size="12" fill="#a6a19c" text-anchor="middle" xml:space="preserve">Paso +</text>
<text x="44.0" y="435.0" font-size="13" fill="#a6a19c" xml:space="preserve">Rama: feature/47-csv</text>
<text x="44.0" y="456.0" font-size="13" xml:space="preserve"><tspan fill="#a6a19c">Pasos</tspan><tspan fill="#a6a19c"> 2/5</tspan></text>
<line x1="44.0" y1="459.0" x2="83.0" y2="459.0" stroke="#a6a19c" stroke-width="1"/>
<text x="44.0" y="477.0" font-size="14" xml:space="preserve"><tspan fill="#6ed889">✓ </tspan><tspan fill="#77726d">Reproducirlo con un archivo real</tspan></text>
<text x="44.0" y="497.0" font-size="14" xml:space="preserve"><tspan fill="#6ed889">✓ </tspan><tspan fill="#77726d">Escribir la prueba con «Muñoz»</tspan></text>
<text x="44.0" y="517.0" font-size="14" xml:space="preserve"><tspan fill="#ece8e2">▸ </tspan><tspan fill="#ece8e2">Exportar en UTF-8 con BOM</tspan></text>
<text x="44.0" y="537.0" font-size="14" xml:space="preserve"><tspan fill="#a6a19c">· </tspan><tspan fill="#a6a19c">Comprobar que abre en Excel</tspan></text>
<text x="44.0" y="557.0" font-size="14" xml:space="preserve"><tspan fill="#a6a19c">· </tspan><tspan fill="#a6a19c">Probar la tarea</tspan></text>
<text x="28.0" y="585.0" font-size="14" fill="#93c5fd" xml:space="preserve">48</text>
<text x="53.2" y="585.0" font-size="14" fill="#93c5fd" xml:space="preserve">Modo oscuro en Ajustes</text>
<text x="532.0" y="585.0" font-size="14" fill="#6ed889" text-anchor="end" font-weight="700" xml:space="preserve">●</text>
</svg>

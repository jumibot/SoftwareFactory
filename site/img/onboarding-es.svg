<text x="32.0" y="386.0" font-size="14" xml:space="preserve"><tspan fill="#a6a19c">☐ </tspan><tspan fill="#ece8e2" font-weight="700">Metodología</tspan></text>
<text x="32.0" y="414.0" font-size="14" fill="#ece8e2" font-weight="700" xml:space="preserve">¿Cómo quieres trabajar en Pantry?</text>
<rect x="30.0" y="424.0" width="500.0" height="46.0" rx="8" fill="#f4bf36" fill-opacity=".07" stroke="#f4bf36" stroke-width="1.6"/>
<text x="40.0" y="444.0" font-size="14" xml:space="preserve"><tspan fill="#f4bf36" font-weight="700">❯ 1. </tspan><tspan fill="#f4bf36" font-weight="700">Con la metodología</tspan></text>
<text x="76.0" y="463.0" font-size="12" fill="#a6a19c" xml:space="preserve">Visión, especificación, diseño y código por partes</text>
<text x="40.0" y="492.0" font-size="14" xml:space="preserve"><tspan fill="#ece8e2">  2. </tspan><tspan fill="#ece8e2">Solo la cola y el panel</tspan></text>
<text x="76.0" y="511.0" font-size="12" fill="#a6a19c" xml:space="preserve">Tareas, ramas y subagentes, sin documentos</text>
<text x="40.0" y="540.0" font-size="14" xml:space="preserve"><tspan fill="#ece8e2">  3. </tspan><tspan fill="#ece8e2">Decidirlo después</tspan></text>
<text x="76.0" y="559.0" font-size="12" fill="#a6a19c" xml:space="preserve">Se cambia cuando quieras con /sf_config</text>
<text x="32.0" y="594.0" font-size="12" fill="#a6a19c" xml:space="preserve">Nada de tu proyecto cambia sin tu OK.</text>

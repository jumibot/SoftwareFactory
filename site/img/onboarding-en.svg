<text x="280.0" y="164.0" font-size="14" fill="#b3aee6" text-anchor="middle" font-weight="700" xml:space="preserve">S O F T W A R E   F A C T O R Y</text>
<text x="280.0" y="192.0" font-size="13" fill="#a6a19c" text-anchor="middle" xml:space="preserve">Your software factory on Claude Code:</text>
<text x="280.0" y="210.0" font-size="13" fill="#a6a19c" text-anchor="middle" xml:space="preserve">from idea to code, task by task.</text>
<rect x="142.0" y="230.0" width="276.0" height="28.0" rx="4" fill="#827dbd"/>
<text x="280.0" y="249.0" font-size="14" fill="#000" text-anchor="middle" font-weight="700" xml:space="preserve">onboard this project to the SF</text>
<text x="22.0" y="346.0" font-size="12" fill="#c8c3bc" font-weight="700" xml:space="preserve">CLAUDE ASKS A FEW QUESTIONS, AS MENUS</text>
<rect x="16" y="358" width="528" height="256" rx="8" fill="#1f1c19" stroke="#4a4540" stroke-width="1.2"/>
<text x="32.0" y="386.0" font-size="14" xml:space="preserve"><tspan fill="#a6a19c">☐ </tspan><tspan fill="#ece8e2" font-weight="700">Method</tspan></text>
<text x="32.0" y="414.0" font-size="14" fill="#ece8e2" font-weight="700" xml:space="preserve">How do you want to work on Pantry?</text>
<rect x="30.0" y="424.0" width="500.0" height="46.0" rx="8" fill="#f4bf36" fill-opacity=".07" stroke="#f4bf36" stroke-width="1.6"/>
<text x="40.0" y="444.0" font-size="14" xml:space="preserve"><tspan fill="#f4bf36" font-weight="700">❯ 1. </tspan><tspan fill="#f4bf36" font-weight="700">Full method</tspan></text>
<text x="76.0" y="463.0" font-size="12" fill="#a6a19c" xml:space="preserve">Vision, spec, design, then slices of code</text>
<text x="40.0" y="492.0" font-size="14" xml:space="preserve"><tspan fill="#ece8e2">  2. </tspan><tspan fill="#ece8e2">Just the queue and the panel</tspan></text>
<text x="76.0" y="511.0" font-size="12" fill="#a6a19c" xml:space="preserve">Tasks, branches and subagents, no documents</text>
<text x="40.0" y="540.0" font-size="14" xml:space="preserve"><tspan fill="#ece8e2">  3. </tspan><tspan fill="#ece8e2">Decide later</tspan></text>
<text x="76.0" y="559.0" font-size="12" fill="#a6a19c" xml:space="preserve">You can switch any time with /sf_config</text>
<text x="32.0" y="594.0" font-size="12" fill="#a6a19c" xml:space="preserve">Nothing in your project changes without your OK.</text>
